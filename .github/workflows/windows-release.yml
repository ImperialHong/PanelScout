name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[packaging]"

      - name: Install bundled Chromium
        run: python -m playwright install chromium

      - name: Run release checks
        run: |
          python -m compileall src tests
          python -m unittest tests.test_windows_release -v

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev-$short"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build PanelScout.exe
        run: pyinstaller --clean --noconfirm packaging/windows/panelscout_windows.spec

      - name: Add Windows instructions
        shell: pwsh
        run: Copy-Item packaging/windows/README-Windows.md dist/PanelScout/README-Windows.txt

      - name: Create portable zip
        id: zip
        shell: pwsh
        run: |
          $zip = "PanelScout-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/PanelScout/* -DestinationPath $zip -Force
          "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanelScout-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ steps.zip.outputs.path }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.zip.outputs.path }}"
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = "Stop"
          if ($releaseExists) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
